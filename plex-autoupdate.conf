# =============================================================================
# Plex Auto-Updater Configuration
# =============================================================================
# Copy this file to /etc/plex-autoupdate.conf and fill in your values.

# Your Plex authentication token (REQUIRED)
# Find it: https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/
PLEX_TOKEN="YOUR_PLEX_TOKEN_HERE"

# Plex server URL (default: http://localhost:32400)
PLEX_URL="http://localhost:32400"

# ---------------------------------------------------------------------------
# Update Channel
# ---------------------------------------------------------------------------
# "plexpass"  = Plex Pass beta builds (requires active Plex Pass subscription)
# "public"    = Stable public releases (available to everyone)
UPDATE_CHANNEL="public"

# ---------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------
# Maximum time (in minutes) to wait for active streams to finish
# before giving up and retrying on the next scheduled run.
MAX_WAIT_MINUTES=360

# How often (in seconds) to re-check for active sessions while waiting.
CHECK_INTERVAL_SECONDS=120

# ---------------------------------------------------------------------------
# Email Notifications
# ---------------------------------------------------------------------------
# Set to "yes" to enable email notifications, "no" to disable.
EMAIL_ENABLED="no"

# Email recipient (only used when EMAIL_ENABLED="yes")
EMAIL_TO=""

# Email sender address
EMAIL_FROM="plex-updater@$(hostname -f 2>/dev/null || echo 'localhost')"

# Subject line prefix for emails
EMAIL_SUBJECT_PREFIX="[Plex Updater]"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
# Log file location
LOG_FILE="/var/log/plex-autoupdate.log"

# Temporary download directory
DOWNLOAD_DIR="/tmp/plex-update"