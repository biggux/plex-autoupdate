###############################################################################
# Plex Backup Configuration
# /etc/plex-backup.conf
###############################################################################

# Plex authentication token (required)
# Find yours: https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/
PLEX_TOKEN=""

# Plex server URL (default: http://localhost:32400)
PLEX_URL="http://localhost:32400"

# Backup destination directory (required)
# Examples: /mnt/backups/plex, /mnt/tank/backups/plex, /mnt/nfs/backups/plex
BACKUP_DIR=""

# What to back up (space-separated list)
# Options: database preferences plugins
# database    = SQLite databases from db-local
# preferences = Preferences.xml (server config, token, libraries)
# plugins     = Plug-in Support directory (scheduled tasks, caches, etc.)
BACKUP_COMPONENTS="database preferences plugins"

# Plex data directory (auto-detected if empty)
# Default: /var/lib/plexmediaserver/Library/Application Support/Plex Media Server
PLEX_DATA_DIR=""

# Plex database directory (local SQLite databases)
# Default: /var/lib/plexmediaserver/db-local
PLEX_DB_DIR="/var/lib/plexmediaserver/db-local"

# Number of backups to retain (0 = keep all)
RETENTION_COUNT=7

# Stop Plex before backing up databases (recommended for consistency)
# If "no", databases are copied live (faster but risk of corruption)
STOP_PLEX="yes"

# Wait for active streams to finish before stopping Plex
# Only applies when STOP_PLEX=yes
WAIT_FOR_STREAMS="yes"

# Maximum time to wait for active streams (in minutes, 0 = don't wait)
MAX_WAIT_MINUTES=60

# How often to re-check for active streams while waiting (in seconds)
CHECK_INTERVAL_SECONDS=120

# Compression (gzip, none)
COMPRESSION="gzip"

# Email notification settings
EMAIL_ENABLED="no"
EMAIL_TO=""
EMAIL_FROM="plex-backup@$(hostname -f 2>/dev/null || hostname)"
EMAIL_SUBJECT_PREFIX="[Plex Backup]"

# Log file path
LOG_FILE="/var/log/plex-backup.log"
